name: Publish v2 container images

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.role }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: migrate
            target: migrate
          - role: file
            target: file
          - role: core
            target: core
          - role: egress
            target: egress
          - role: sfu
            target: sfu
          - role: admin
            target: admin
          - role: edge
            target: edge-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.role }}
          tags: |
            type=sha,prefix=sha-

      - name: Set build date
        id: build
        shell: bash
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VCS_BRANCH=${{ github.ref_name }}
            VCS_TREE_STATE=clean
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=${{ matrix.role }}

  deploy-develop:
    name: Deploy develop to 1Panel
    needs: publish
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout deployment definition
        uses: actions/checkout@v7

      - name: Pull the freshly published images in 1Panel
        env:
          ONEPANEL_URL: ${{ secrets.ONEPANEL_URL }}
          ONEPANEL_API_KEY: ${{ secrets.ONEPANEL_API_KEY }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          : "${ONEPANEL_URL:?Set ONEPANEL_URL in GitHub Actions secrets}"
          : "${ONEPANEL_API_KEY:?Set ONEPANEL_API_KEY in GitHub Actions secrets}"

          panel_request() {
            local method="$1" path="$2" body="$3" response status http_body api_code timestamp token
            timestamp="$(date +%s)"
            token="$(printf '1panel:%s' "$timestamp" | openssl dgst -sha256 -hmac "$ONEPANEL_API_KEY" -hex | awk '{print $2}')"
            response="$(curl --fail-with-body --silent --show-error \
              --request "$method" \
              --url "${ONEPANEL_URL%/}/api/v2${path}" \
              --header 'Content-Type: application/json' \
              --header "1Panel-Token: $token" \
              --header "1Panel-Timestamp: $timestamp" \
              --data "$body" \
              --write-out $'\n%{http_code}')"
            status="${response##*$'\n'}"
            if [[ "$status" != 2* ]]; then
              printf '%s\n' "$response" >&2
              return 1
            fi
            http_body="${response%$'\n'*}"
            api_code="$(printf '%s' "$http_body" | jq -r '.code // empty' 2>/dev/null || true)"
            if [[ "$api_code" != "200" ]]; then
              printf '1Panel API error: %s\n' "$http_body" >&2
              return 1
            fi
            printf '%s\n' "$http_body"
          }

          wait_for_image() {
            local container="$1" expected="$2" attempt containers actual
            for attempt in $(seq 1 30); do
              containers="$(panel_request GET '/containers?page=1&pageSize=100' '')"
              actual="$(printf '%s' "$containers" | jq -r --arg name "$container" \
                '.. | objects | select((.name? // .containerName? // "") == $name) | (.image? // .imageName? // empty)' \
                2>/dev/null | head -n1)"
              if [[ "$actual" == "$expected" ]]; then
                echo "Verified ${container} is running ${actual}"
                return 0
              fi
              echo "Waiting for ${container}: current=${actual:-unknown}, expected=${expected} (${attempt}/30)"
              sleep 5
            done
            echo "Timed out waiting for ${container} to run ${expected}" >&2
            return 1
          }

          # docker/metadata-action's sha tag defaults to the short commit SHA.
          deploy_tag="sha-${GITHUB_SHA::7}"
          for role in migrate file core egress sfu admin edge; do
            echo "Pulling ${IMAGE_PREFIX}/${role}:${deploy_tag}"
            panel_request POST /containers/image/pull \
              "{\"imageName\":[\"${IMAGE_PREFIX}/${role}:${deploy_tag}\"]}" >/dev/null
          done

          # Compose Update does not change the external .env used by this
          # project. Upgrade each application container directly instead;
          # 1Panel preserves its existing mounts, ports, networks, and env.
          for role in migrate file core egress sfu admin edge; do
            container="telesrv-${role}-1"
            echo "Upgrading ${container} to ${IMAGE_PREFIX}/${role}:${deploy_tag}"
            upgrade_body="$(jq -n \
              --arg container "$container" \
              --arg image "${IMAGE_PREFIX}/${role}:${deploy_tag}" \
              '{names: [$container], image: $image, forcePull: true}')"
            panel_request POST /containers/upgrade "$upgrade_body" >/dev/null
            wait_for_image "$container" "${IMAGE_PREFIX}/${role}:${deploy_tag}"
          done

          echo "1Panel container upgrades verified"

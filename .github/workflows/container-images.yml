name: Publish v2 container images

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.role }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: migrate
            target: migrate
          - role: file
            target: file
          - role: core
            target: core
          - role: egress
            target: egress
          - role: sfu
            target: sfu
          - role: admin
            target: admin
          - role: edge
            target: edge-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.role }}
          tags: |
            type=sha,prefix=sha-

      - name: Set build date
        id: build
        shell: bash
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VCS_BRANCH=${{ github.ref_name }}
            VCS_TREE_STATE=clean
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=${{ matrix.role }}

  deploy-develop:
    name: Deploy develop to 1Panel
    needs: publish
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout deployment definition
        uses: actions/checkout@v7

      - name: Pull the freshly published images in 1Panel
        env:
          ONEPANEL_URL: ${{ secrets.ONEPANEL_URL }}
          ONEPANEL_API_KEY: ${{ secrets.ONEPANEL_API_KEY }}
          ONEPANEL_COMPOSE_NAME: telesrv
          ONEPANEL_COMPOSE_PATH: /root/gramsrv/deploy/docker/compose.yaml
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          : "${ONEPANEL_URL:?Set ONEPANEL_URL in GitHub Actions secrets}"
          : "${ONEPANEL_API_KEY:?Set ONEPANEL_API_KEY in GitHub Actions secrets}"
          : "${ONEPANEL_COMPOSE_NAME:?Set ONEPANEL_COMPOSE_NAME in GitHub Actions secrets}"

          panel_request() {
            local method="$1" path="$2" body="$3" response status timestamp token
            timestamp="$(date +%s)"
            token="$(printf '1panel:%s' "$timestamp" | openssl dgst -sha256 -hmac "$ONEPANEL_API_KEY" -hex | awk '{print $2}')"
            response="$(curl --fail-with-body --silent --show-error \
              --request "$method" \
              --url "${ONEPANEL_URL%/}/api/v2${path}" \
              --header 'Content-Type: application/json' \
              --header "1Panel-Token: $token" \
              --header "1Panel-Timestamp: $timestamp" \
              --data "$body" \
              --write-out $'\n%{http_code}')"
            status="${response##*$'\n'}"
            if [[ "$status" != 2* ]]; then
              printf '%s\n' "$response" >&2
              return 1
            fi
            printf '%s\n' "${response%$'\n'*}"
          }

          # docker/metadata-action's sha tag defaults to the short commit SHA.
          deploy_tag="sha-${GITHUB_SHA::7}"
          for role in migrate file core egress sfu admin edge; do
            echo "Pulling ${IMAGE_PREFIX}/${role}:${deploy_tag}"
            panel_request POST /containers/image/pull \
              "{\"imageName\":\"${IMAGE_PREFIX}/${role}:${deploy_tag}\"}" >/dev/null
          done

          # 1Panel's compose `up` operation does not pull images. Replace only
          # the image tag in the checked-in Compose definition, then let the
          # Compose update API recreate the project using the already-pulled
          # immutable images. An empty env list preserves the existing 1Panel
          # environment file and its credentials.
          compose_info="$(panel_request POST /containers/compose/search '{"page":1,"pageSize":50}')"
          current_env="$(printf '%s' "$compose_info" | jq -r '.data.items[] | select(.name == $name) | .env' --arg name "$ONEPANEL_COMPOSE_NAME")"
          if [[ -z "$current_env" || "$current_env" == "null" ]]; then
            echo "Could not read the existing 1Panel environment for ${ONEPANEL_COMPOSE_NAME}" >&2
            exit 1
          fi
          updated_env="$(printf '%s\n' "$current_env" | sed -E "s/^TELESRV_IMAGE_TAG=.*/TELESRV_IMAGE_TAG=${deploy_tag}/")"
          updated_env="$(printf '%s\n' "$updated_env" | sed -E "s#^TELESRV_IMAGE_PREFIX=.*#TELESRV_IMAGE_PREFIX=${IMAGE_PREFIX}#")"
          compose_content="$(sed -E "s/:\$\{TELESRV_IMAGE_TAG:-v2\}/:${deploy_tag}/g" deploy/docker/compose.yaml)"
          update_body="$(jq -n \
            --arg name "$ONEPANEL_COMPOSE_NAME" \
            --arg path "$ONEPANEL_COMPOSE_PATH" \
            --arg content "$compose_content" \
            --arg env "$updated_env" \
            '{name: $name, path: $path, content: $content, env: $env}')"

          echo "Updating and restarting Compose project ${ONEPANEL_COMPOSE_NAME}"
          panel_request POST /containers/compose/update "$update_body" >/dev/null

          echo "1Panel deployment request completed"
